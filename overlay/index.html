<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stream Overlay Display</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, sans-serif;
      color: #fff;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      position: relative;
    }
    .overlay-box {
      position: absolute;
      top: 40px;
      left: 40px;
      background: rgba(26, 26, 30, 0.95);
      border: 2px solid #00bcd4;
      padding: 20px 30px;
      border-radius: 12px;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #field1Display {
      font-size: 18px;
      color: #00bcd4;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #field2Display {
      font-size: 24px;
      font-weight: bold;
    }
    #imageDisplay {
      margin-top: 15px;
      max-width: 100%;
      max-height: 200px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="overlay-box" id="overlayContainer">
    <div id="field1Display">Waiting for control panel...</div>
    <div id="field2Display"></div>
    <img id="imageDisplay" src="" alt="Overlay Image">
  </div>

  <script>
    function renderOverlay() {
      const rawData = localStorage.getItem('obs_overlay_data');
      if (!rawData) return;

      try {
        const data = JSON.parse(rawData);

        // Update text fields dynamically
        document.getElementById('field1Display').textContent = data.field1 || '';
        document.getElementById('field2Display').textContent = data.field2 || '';

        // Handle image
        const imgElement = document.getElementById('imageDisplay');
        if (data.imageUrl && data.imageUrl.trim() !== "") {
          imgElement.src = data.imageUrl;
          imgElement.style.display = 'block';
        } else {
          imgElement.style.display = 'none';
        }

        // Handle visibility toggle
        const container = document.getElementById('overlayContainer');
        container.style.display = data.isVisible !== false ? 'block' : 'none';
      } catch (err) {
        console.error("Error reading overlay data:", err);
      }
    }

    // Check storage immediately on load
    window.addEventListener('DOMContentLoaded', renderOverlay);

    // Poll every 500ms so OBS catches changes instantly without needing a page refresh
    setInterval(renderOverlay, 500);
  </script>
</body>
</html>
