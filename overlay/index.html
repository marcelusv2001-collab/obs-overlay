<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stream Overlay Display</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: transparent; /* Transparent so it looks clean as an OBS overlay later */
      font-family: Arial, sans-serif;
      color: #fff;
    }
    .overlay-box {
      background: rgba(26, 26, 30, 0.9);
      border: 2px solid #00bcd4;
      padding: 20px 30px;
      border-radius: 12px;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #field1Display {
      font-size: 18px;
      color: #00bcd4;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #field2Display {
      font-size: 24px;
      font-weight: bold;
    }
    #imageDisplay {
      margin-top: 15px;
      max-width: 100%;
      max-height: 200px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="overlay-box" id="overlayContainer">
    <div id="field1Display">Waiting for control panel...</div>
    <div id="field2Display"></div>
    <img id="imageDisplay" src="" alt="Overlay Image">
  </div>

  <script>
    function renderOverlay() {
      const rawData = localStorage.getItem('obs_overlay_data');
      if (!rawData) return;

      try {
        const data = JSON.parse(rawData);
        
        // Update text fields
        document.getElementById('field1Display').textContent = data.field1 || '';
        document.getElementById('field2Display').textContent = data.field2 || '';

        // Handle image URL if provided
        const imgElement = document.getElementById('imageDisplay');
        if (data.imageUrl && data.imageUrl.trim() !== "") {
          imgElement.src = data.imageUrl;
          imgElement.style.display = 'block';
        } else {
          imgElement.style.display = 'none';
        }

        // Handle visibility toggle
        const container = document.getElementById('overlayContainer');
        if (data.isVisible === false) {
          container.style.display = 'none';
        } else {
          container.style.display = 'block';
        }
      } catch (err) {
        console.error("Error reading overlay data:", err);
      }
    }

    // Load data when the page first opens
    window.addEventListener('DOMContentLoaded', renderOverlay);

    // Listen live for changes when you click "Push Live" on your control panel tab
    window.addEventListener('storage', (e) => {
      if (e.key === 'obs_overlay_data') {
        renderOverlay();
      }
    });
  </script>
</body>
</html>
