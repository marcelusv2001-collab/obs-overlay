<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stream Overlay Display</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, sans-serif;
      color: #fff;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      position: relative;
    }
    .overlay-box {
      position: absolute;
      top: 40px;
      left: 40px;
      background: rgba(26, 26, 30, 0.95);
      border: 2px solid #00bcd4;
      padding: 20px 30px;
      border-radius: 12px;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #field1Display {
      font-size: 18px;
      color: #00bcd4;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #field2Display {
      font-size: 24px;
      font-weight: bold;
    }
    #imageDisplay {
      margin-top: 15px;
      max-width: 100%;
      max-height: 200px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="overlay-box" id="overlayContainer">
    <div id="field1Display"></div>
    <div id="field2Display"></div>
    <img id="imageDisplay" src="" alt="Overlay Image">
  </div>

  <script>
    function renderOverlay() {
      const params = new URLSearchParams(window.location.search);
      let field1 = "", field2 = "", imageUrl = "", isVisible = true;

      // Check if URL parameters exist
      if (params.has('f1') || params.has('f2') || params.has('img')) {
        field1 = params.get('f1') || '';
        field2 = params.get('f2') || '';
        imageUrl = params.get('img') || '';
        isVisible = params.get('vis') !== '0';
      } else {
        // Fallback to localStorage for browser tabs
        const rawData = localStorage.getItem('obs_overlay_data');
        if (rawData) {
          try {
            const data = JSON.parse(rawData);
            field1 = data.field1 || '';
            field2 = data.field2 || '';
            imageUrl = data.imageUrl || '';
            isVisible = data.isVisible !== false;
          } catch (e) {
            console.error("Error parsing storage data:", e);
          }
        }
      }

      // Update text fields
      document.getElementById('field1Display').textContent = field1;
      document.getElementById('field2Display').textContent = field2;

      // Handle image
      const imgElement = document.getElementById('imageDisplay');
      if (imageUrl && imageUrl.trim() !== "") {
        imgElement.src = imageUrl;
        imgElement.style.display = 'block';
      } else {
        imgElement.style.display = 'none';
      }

      // Handle container visibility
      const container = document.getElementById('overlayContainer');
      container.style.display = isVisible ? 'block' : 'none';
    }

    // Load immediately on open
    window.addEventListener('DOMContentLoaded', renderOverlay);

    // Listen for storage changes from local tabs
    window.addEventListener('storage', (e) => {
      if (e.key === 'obs_overlay_data') {
        renderOverlay();
      }
    });

    // Poll every second to keep sync
    setInterval(renderOverlay, 1000);
  </script>
</body>
</html>
