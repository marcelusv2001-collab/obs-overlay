<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Stream Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      /* If testing in a normal browser, change 'transparent' to '#222' to see the window */
      background: transparent; 
      font-family: Arial, sans-serif;
      color: white;
    }
    .overlay-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.85);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      max-width: 500px;
    }
    .overlay-container img {
      width: 106px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .text-content h2 {
      margin: 0 0 5px 0;
      font-size: 20px;
      line-height: 1.2;
    }
    .text-content p {
      margin: 0;
      font-size: 14px;
      color: #ccc;
      line-height: 1.3;
    }
    .hidden {
      display: none !important;
    }
    /* Temporary debug badge so you know the script is running */
    #debug-badge {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #0ff;
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 4px;
      z-index: 9999;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <!-- Debug badge helps you see status in real time -->
  <div id="debug-badge">Initializing...</div>

  <div id="overlay" class="overlay-container hidden">
    <img id="overlay-img" src="" alt="Overlay Image" style="display: none;">
    <div class="text-content">
      <h2 id="overlay-field1"></h2>
      <p id="overlay-field2"></p>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwmLvFNJvle5De-KJpBTBLpgw2k2RlE_klW7lEkS8OwNi1T5g5GSqMvPhSm2aO3jm5u/exec';
    const debugBadge = document.getElementById('debug-badge');

    function getProp(obj, targetKey) {
      if (!obj) return undefined;
      const key = Object.keys(obj).find(
        k => k.trim().toLowerCase().replace(/[^a-z0-9]/g, '') === targetKey.toLowerCase().replace(/[^a-z0-9]/g, '')
      );
      return key ? obj[key] : undefined;
    }

    function formatImageUrl(url) {
      if (!url) return '';
      let strUrl = String(url).trim();
      const driveMatch = strUrl.match(/\/d\/([^\/]+)/) || strUrl.match(/id=([^&]+)/);
      if (driveMatch && driveMatch[1] && (strUrl.includes('drive.google.com') || strUrl.includes('docs.google.com'))) {
        return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
      }
      return strUrl;
    }

    async function fetchOverlayData() {
      try {
        debugBadge.textContent = "Fetching data...";
        const response = await fetch(SCRIPT_URL, { redirect: 'follow' });
        const data = await response.json();
        
        if (!Array.isArray(data)) {
          debugBadge.textContent = "Error: Data is not an array";
          debugBadge.style.color = "#ff5555";
          return;
        }

        const activeItem = data.find(row => {
          const val = getProp(row, 'is_active');
          return val === true || String(val).trim().toUpperCase() === 'TRUE' || val === 1 || val === '1';
        });

        const overlay = document.getElementById('overlay');
        const img = document.getElementById('overlay-img');

        if (activeItem) {
          debugBadge.textContent = "Status: Showing Active Item";
          debugBadge.style.color = "#55ff55";

          document.getElementById('overlay-field1').textContent = getProp(activeItem, 'field_one') || getProp(activeItem, 'field1') || '';
          document.getElementById('overlay-field2').textContent = getProp(activeItem, 'field_two') || getProp(activeItem, 'field2') || '';
          
          const rawImgUrl = getProp(activeItem, 'image_url') || getProp(activeItem, 'image') || '';
          const formattedImgUrl = formatImageUrl(rawImgUrl);

          if (formattedImgUrl) {
            img.src = formattedImgUrl;
            img.style.display = 'block';
          } else {
            img.style.display = 'none';
          }

          overlay.classList.remove('hidden');
        } else {
          debugBadge.textContent = "Status: Connected (No row has Is_Active = TRUE)";
          debugBadge.style.color = "#ffaa00";
          overlay.classList.add('hidden');
        }
      } catch (error) {
        console.error('Error fetching overlay data:', error);
        debugBadge.textContent = "Error: Check Console (F12)";
        debugBadge.style.color = "#ff5555";
      }
    }

    fetchOverlayData();
    setInterval(fetchOverlayData, 5000);
  </script>
</body>
</html>
